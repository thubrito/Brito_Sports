<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrinho — Brito's Store</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0a0a0a;--bg2:#111;--bg3:#1a1a1a;--accent:#e8ff00;--accent2:#ff3c3c;--text:#f0f0f0;--muted:#888;--border:rgba(255,255,255,0.08);--font-display:'Bebas Neue',sans-serif;--font-body:'Barlow',sans-serif}
body{background:var(--bg);color:var(--text);font-family:var(--font-body)}
nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:64px;background:rgba(10,10,10,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.logo{font-family:var(--font-display);font-size:26px;letter-spacing:3px;color:var(--accent);text-decoration:none}.logo span{color:var(--text)}
.nav-right{display:flex;align-items:center;gap:16px}
.btn-nav{background:var(--accent);color:#000;border:none;padding:8px 18px;font-family:var(--font-body);font-weight:700;font-size:11px;letter-spacing:1px;text-transform:uppercase;cursor:pointer}
.breadcrumb{padding:88px 60px 0;display:flex;gap:8px;font-size:12px;color:var(--muted)}
.breadcrumb a{color:var(--muted);text-decoration:none}.breadcrumb a:hover{color:var(--accent)}
.cart-layout{display:grid;grid-template-columns:1fr 380px;gap:32px;padding:32px 60px 100px;max-width:1400px;margin:0 auto}
.cart-title{font-family:var(--font-display);font-size:56px;color:var(--text);margin-bottom:32px}
.cart-title em{color:var(--accent);font-style:normal}
.cart-items{display:flex;flex-direction:column;gap:2px}
.cart-item{background:var(--bg3);border:1px solid var(--border);padding:20px;display:grid;grid-template-columns:100px 1fr auto;gap:20px;align-items:center;transition:border-color .2s}
.cart-item:hover{border-color:rgba(232,255,0,0.15)}
.item-img{aspect-ratio:1/1;background:var(--bg2);display:flex;align-items:center;justify-content:center}
.item-details{}
.item-club{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.item-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:8px}
.item-meta{display:flex;gap:8px;margin-bottom:14px}
.meta-tag{font-size:11px;background:var(--bg2);border:1px solid var(--border);padding:3px 8px;color:var(--muted)}
.item-qty{display:flex;align-items:center;gap:0}
.qty-btn{width:32px;height:32px;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.qty-btn:hover{border-color:var(--accent);color:var(--accent)}
.qty-num{width:40px;height:32px;background:var(--bg);border-top:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.item-right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.item-price{font-family:var(--font-display);font-size:32px;color:var(--accent)}
.btn-remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;letter-spacing:1px;text-transform:uppercase;transition:color .2s}
.btn-remove:hover{color:var(--accent2)}
.cart-empty{text-align:center;padding:100px 40px;display:none}
.cart-empty h2{font-family:var(--font-display);font-size:48px;margin-bottom:16px;color:var(--muted)}
.cart-empty p{color:var(--muted);margin-bottom:32px}

/* ORDER SUMMARY */
.order-summary{background:var(--bg3);border:1px solid var(--border);padding:32px;height:fit-content;position:sticky;top:80px}
.summary-title{font-family:var(--font-display);font-size:32px;color:var(--text);margin-bottom:24px}
.summary-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:10px 0;border-bottom:1px solid var(--border)}
.summary-row:last-of-type{border-bottom:none}
.summary-row .label{color:var(--muted)}
.summary-row .val{color:var(--text);font-weight:600}
.summary-total{display:flex;justify-content:space-between;align-items:baseline;padding:20px 0 24px;border-top:1px solid var(--border);margin-top:8px}
.summary-total .label{font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.summary-total .val{font-family:var(--font-display);font-size:40px;color:var(--accent)}
.coupon-row{margin:16px 0;display:flex;gap:0}
.coupon-input{flex:1;background:var(--bg2);border:1px solid var(--border);border-right:none;padding:10px 14px;color:var(--text);font-family:var(--font-body);font-size:13px;outline:none}
.coupon-input::placeholder{color:var(--muted)}
.coupon-btn{background:var(--bg2);border:1px solid var(--border);color:var(--accent);padding:10px 16px;font-family:var(--font-body);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:all .2s}
.coupon-btn:hover{background:var(--bg3)}
.btn-checkout{width:100%;background:var(--accent);color:#000;border:none;padding:18px;font-family:var(--font-body);font-weight:900;font-size:14px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s;margin-bottom:10px}
.btn-checkout:hover{background:#fff;transform:translateY(-1px)}
.btn-continue{width:100%;background:transparent;color:var(--muted);border:1px solid var(--border);padding:14px;font-family:var(--font-body);font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.btn-continue:hover{border-color:var(--text);color:var(--text)}
.security-badges{display:flex;justify-content:center;gap:16px;margin-top:20px;padding-top:20px;border-top:1px solid var(--border)}
.sec-badge{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.sec-badge svg{width:14px;height:14px;stroke:var(--muted);fill:none}

@media(max-width:1024px){.cart-layout{grid-template-columns:1fr;padding:24px 32px 80px}.order-summary{position:static}}
@media(max-width:768px){
  nav{padding:0 20px;height:56px}
  .breadcrumb{padding:76px 20px 0}
  .cart-layout{padding:16px 20px 60px}
  .cart-item{grid-template-columns:72px 1fr;gap:12px;padding:14px}
  .item-right{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}
  .item-name{font-size:13px}
  .item-price{font-size:26px}
  .summary-title{font-size:26px}
  .summary-total .val{font-size:32px}
  .order-summary{padding:24px}
  .security-badges{flex-wrap:wrap;gap:12px}
}
@media(max-width:480px){
  .cart-item{grid-template-columns:60px 1fr;gap:10px}
  .item-meta{flex-wrap:wrap;gap:4px}
  .coupon-row{flex-direction:column}
  .coupon-btn{width:100%;padding:12px}
}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="logo">BRITO'S<span> STORE</span></a>
  <div class="nav-right">
    <button class="btn-nav" onclick="location.href='rastrear.html'">Rastrear Pedido</button>
  </div>
</nav>

<div class="breadcrumb">
  <a href="index.html">Home</a><span>/</span>
  <a href="loja.html">Loja</a><span>/</span>
  <span style="color:var(--text)">Carrinho</span>
</div>

<div class="cart-layout">
  <div>
    <h1 class="cart-title">MEU<br><em>CARRINHO</em></h1>

    <div class="cart-items" id="cartItems"></div>

    <div class="cart-empty" id="cartEmpty">
      <h2>CARRINHO VAZIO</h2>
      <p>Você ainda não adicionou nenhuma camisa.</p>
      <button class="btn-checkout" style="max-width:280px;margin:0 auto" onclick="location.href='loja.html'">Ver Catálogo</button>
    </div>

  </div>

  <div class="order-summary">
    <div class="summary-title">RESUMO</div>
    <div class="summary-row"><span class="label">Subtotal</span><span class="val" id="subtotal">R$0</span></div>
    <div class="summary-row"><span class="label">Frete</span><span class="val">Calculado no checkout</span></div>
    <div class="summary-row"><span class="label">Desconto</span><span class="val" id="discount">—</span></div>
    <div class="coupon-row">
      <input class="coupon-input" type="text" placeholder="Código de cupom" id="couponInput">
      <button class="coupon-btn" onclick="applyCoupon()">Aplicar</button>
    </div>
    <div class="summary-total">
      <span class="label">Total</span>
      <span class="val" id="totalPrice">R$0</span>
    </div>
    <button class="btn-checkout" onclick="location.href='checkout.html'">Finalizar Pedido</button>
    <button class="btn-continue" onclick="location.href='loja.html'">← Continuar comprando</button>
    <div class="security-badges">
      <div class="sec-badge"><svg viewBox="0 0 24 24" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Pagamento seguro</div>
      <div class="sec-badge"><svg viewBox="0 0 24 24" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>Pix criptografado</div>
    </div>
  </div>
</div>

<script>
const mockCart = [
  {id:1,name:'Camisa Titular 2025/26',club:'Corinthians',liga:'Brasileirão',price:139,size:'G',qty:1,enc:true,color:'rgba(220,50,50,0.4)',stroke:'rgba(220,50,50,0.6)'},
  {id:2,name:'Camisa Titular Copa 2026',club:'Brasil',liga:'Seleção',price:159,size:'M',qty:1,enc:false,color:'rgba(0,30,120,0.4)',stroke:'rgba(60,120,255,0.6)'},
];
let cart = JSON.parse(localStorage.getItem('cart')||'null') || mockCart;

function render(){
  const el=document.getElementById('cartItems');
  const empty=document.getElementById('cartEmpty');
  const encNote=document.getElementById('encNote');
  if(!cart.length){el.innerHTML='';empty.style.display='block';return;}
  empty.style.display='none';
  encNote.style.display=hasEnc?'block':'none';
  el.innerHTML=cart.map((item,i)=>`
    <div class="cart-item">
      <div class="item-img">
        <svg width="60" height="80" viewBox="0 0 200 260" fill="none">
          <path d="M60 20L30 60L10 55L25 100L10 200L80 215L80 120L120 120L120 215L190 200L175 100L190 55L170 60L140 20L120 30L110 60Q100 70 90 60L80 30Z" fill="${item.color||'rgba(100,100,100,0.3)'}" stroke="${item.stroke||'rgba(150,150,150,0.5)'}" stroke-width="2"/>
        </svg>
      </div>
      <div class="item-details">
        <div class="item-club">${item.club} • ${item.liga}</div>
        <div class="item-name">${item.name}</div>
        <div class="item-meta">
          <span class="meta-tag">Tamanho: ${item.size}</span>
        </div>
        <div class="item-qty">
          <button class="qty-btn" onclick="updateQty(${i},-1)">−</button>
          <div class="qty-num">${item.qty}</div>
          <button class="qty-btn" onclick="updateQty(${i},1)">+</button>
        </div>
      </div>
      <div class="item-right">
        <div class="item-price">R$${item.price*item.qty}</div>
        <button class="btn-remove" onclick="removeItem(${i})">Remover</button>
      </div>
    </div>
  `).join('');
  const sub=cart.reduce((a,i)=>a+i.price*i.qty,0);
  document.getElementById('subtotal').textContent='R$'+sub;
  document.getElementById('totalPrice').textContent='R$'+sub;
}
function updateQty(i,d){ cart[i].qty=Math.max(1,cart[i].qty+d); localStorage.setItem('cart',JSON.stringify(cart)); render(); }
function removeItem(i){ cart.splice(i,1); localStorage.setItem('cart',JSON.stringify(cart)); render(); }
function applyCoupon(){ const c=document.getElementById('couponInput').value.toUpperCase(); if(c==='BRITO10'){ document.getElementById('discount').textContent='-10%'; alert('Cupom aplicado! 10% de desconto.'); } else { alert('Cupom inválido.'); } }
render();
</script>
</body>
</html>
